name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      # 실명이 빌드 결과물에 섞이면 배포를 멈춘다 (가릴 이름은 비공개 데이터 저장소에만 있어야 한다)
      - name: Check no data in dist
        run: |
          if grep -rIlE --exclude=share.enc.json 'jiwoo|yeseo|__local-data' dist; then echo "dist 에 들어가면 안 되는 문자열이 있다"; exit 1; fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
